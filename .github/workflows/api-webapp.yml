# FastAPI（api/）をテストして App Service の Web アプリ app-kyotsuchi-map-api へデプロイする。
# 必要な設定: secrets.AZURE_WEBAPP_PUBLISH_PROFILE（docs/azure-setup.md 参照）
# 依存パッケージは App Service 側でビルドする（SCM_DO_BUILD_DURING_DEPLOYMENT=true）。
name: API (App Service)

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-webapp.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package (exclude tests / local files)
        working-directory: api
        run: zip -r ../api.zip . -x ".venv/*" "tests/*" "scripts/*" "*.db" ".env*" "local.settings*.json" "requirements-dev.txt" "*/__pycache__/*"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-kyotsuchi-map-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
