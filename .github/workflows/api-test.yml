# API（api/）のテストだけを実行する。デプロイは手動（docs/azure-setup.md の「再デプロイ > API」）。
# Web アプリの SCM 基本認証を無効のままにするため、発行プロファイルによる自動デプロイは使わない。
name: API test

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-test.yml"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
