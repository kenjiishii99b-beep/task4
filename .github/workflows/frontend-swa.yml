# Next.js（静的エクスポート）をビルドして Azure Static Web Apps にアップロードする。
# 必要な設定（GitHub リポジトリの Settings > Secrets and variables > Actions）:
#   secrets.AZURE_STATIC_WEB_APPS_API_TOKEN : SWA のデプロイトークン
#   vars.API_BASE_URL                       : https://<function-app名>.azurewebsites.net
name: Frontend (Static Web Apps)

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-swa.yml"]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # LayoutProps などのルート型は .next/types に生成されるため、型チェックの前に生成する
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}

      # ビルド済みの out/ をそのまま配置する（SWA 側の Oryx ビルドは使わない）
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/out
          skip_app_build: true
          skip_api_build: true
