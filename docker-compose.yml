# ローカル用 MySQL 8（Azure Database for MySQL フレキシブル サーバーと同じメジャーバージョン）
# 起動: docker compose up -d
# api/.env の DATABASE_URL を mysql+pymysql://app:app_password@127.0.0.1:3306/person_map に変更して使う
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: person_map
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
